{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="text-center mb-4 fw-bold">Create a PrepEdge Account</h3>
                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label font-weight-bold">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label font-weight-bold">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label font-weight-bold">Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" name="password" required>
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword">👁️</button>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="role" class="form-label font-weight-bold">Account Type</label>
                        <select class="form-select" id="role" name="role">
                            <option value="student" selected>Student</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    
                    <div class="mb-4 d-none" id="adminKeyGroup">
                        <label for="admin_key" class="form-label font-weight-bold text-danger">Super Admin Secret Key</label>
                        <input type="password" class="form-control border-danger" id="admin_key" name="admin_key" placeholder="Enter key for instant admin approval">
                        <small class="text-muted d-block mt-1">Enter key to bypass approval, or leave empty to request access from an admin.</small>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Register</button>
                </form>
                <div class="text-center mt-3">
                    <small>Already registered? <a href="{{ url_for('login') }}">Login here</a></small>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const roleSelect = document.getElementById('role');
        const adminKeyGroup = document.getElementById('adminKeyGroup');

        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.textContent = type === 'password' ? '👁️' : '🙈';
            });
        }

        function checkRole() {
            if (roleSelect.value === 'admin') {
                adminKeyGroup.classList.remove('d-none');
            } else {
                adminKeyGroup.classList.add('d-none');
            }
        }

        roleSelect.addEventListener('change', checkRole);
        checkRole(); // Run initial check on page load
    });
</script>
{% endblock %}
