{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>{{ category }} Test</h2>
    <div class="alert alert-danger mb-0 py-2 px-3">
        ⏱️ Time Remaining: <strong id="timer">02:00</strong>
    </div>
</div>

<form id="test-form" action="{{ url_for('submit_test', category=category) }}" method="POST">
    {% for q in questions %}
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-white">
            <h5 class="mb-0">Q{{ loop.index }}. {{ q.question_text }}</h5>
            <small class="badge bg-secondary">{{ q.company }}</small>
        </div>
        <div class="card-body">
            <div class="form-check mb-2">
                <input class="form-check-input" type="radio" name="question_{{ q.id }}" id="q{{ q.id }}_a" value="A">
                <label class="form-check-label" for="q{{ q.id }}_a">A) {{ q.option_a }}</label>
            </div>
            <div class="form-check mb-2">
                <input class="form-check-input" type="radio" name="question_{{ q.id }}" id="q{{ q.id }}_b" value="B">
                <label class="form-check-label" for="q{{ q.id }}_b">B) {{ q.option_b }}</label>
            </div>
            <div class="form-check mb-2">
                <input class="form-check-input" type="radio" name="question_{{ q.id }}" id="q{{ q.id }}_c" value="C">
                <label class="form-check-label" for="q{{ q.id }}_c">C) {{ q.option_c }}</label>
            </div>
            <div class="form-check mb-2">
                <input class="form-check-input" type="radio" name="question_{{ q.id }}" id="q{{ q.id }}_d" value="D">
                <label class="form-check-label" for="q{{ q.id }}_d">D) {{ q.option_d }}</label>
            </div>
        </div>
    </div>
    {% endfor %}

    <button type="submit" class="btn btn-success btn-lg w-100 mb-5">Submit Test</button>
</form>

<script>
    let duration = {{ time_limit }} * 60;
    const timerDisplay = document.getElementById('timer');
    const form = document.getElementById('test-form');

    const countdown = setInterval(() => {
        let minutes = Math.floor(duration / 60);
        let seconds = duration % 60;
        seconds = seconds < 10 ? '0' + seconds : seconds;
        timerDisplay.textContent = `${minutes}:${seconds}`;

        if (--duration < 0) {
            clearInterval(countdown);
            alert("Time's up! Submitting your test automatically.");
            form.submit();
        }
    }, 1000);
</script>
{% endblock %}
